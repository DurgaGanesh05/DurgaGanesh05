<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="94" viewBox="0 0 1200 94" role="img" aria-labelledby="footer-title">
  <title id="footer-title">Keep building, keep exploring</title>
  <defs>
    <linearGradient id="ganesh-footer-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#451126"/>
      <stop offset="100%" stop-color="#190B12"/>
    </linearGradient>
    <linearGradient id="ganesh-footer-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#701A3D"/>
      <stop offset="50%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#701A3D"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="94" rx="12" fill="url(#ganesh-footer-bg)"/>
  <path d="M32 17H1168" stroke="url(#ganesh-footer-line)" stroke-width="1.5" opacity="0.85">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="5s" repeatCount="indefinite"/>
  </path>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="2" fill="#F8F0F3">KEEP BUILDING · KEEP EXPLORING</text>
  <text x="600" y="77" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="3" fill="#E5B5C7">FULL STACK  +  DATA SCIENCE</text>
</svg>
